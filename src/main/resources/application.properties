spring.application.name=vetcare-inventario
server.port=8080

# Conexion a MySQL (puedes definir DB_USER y DB_PASSWORD como variables de entorno)
spring.datasource.url=jdbc:mysql://localhost:3306/vetcare_inventario?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:TU_CONTRASENA}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CORS: origenes permitidos, separados por coma
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# JWT (la clave debe tener 32 caracteres o mas; en produccion usar la variable JWT_SECRET)
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-de-desarrollo-por-una-de-mas-de-32-caracteres}
app.jwt.expiration-minutes=480
